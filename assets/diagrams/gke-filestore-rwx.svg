<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34a853"/>
    </marker>
    <style>
      .title { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
      .sub { font-family: "Inter", system-ui, sans-serif; font-weight: 500; fill: #cbd5e1; }
      .muted { font-family: "Inter", system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
      .mono { font-family: "JetBrains Mono", "Fira Code", monospace; font-weight: 600; fill: #7dd3fc; }
      .badge { font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect x="4" y="4" width="1152" height="342" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Box: Cloud Filestore RWX -->
  <g filter="url(#shadow)">
    <rect x="120" y="22" width="920" height="92" rx="12" fill="url(#cyanCard)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="142" y="36" width="150" height="22" rx="11" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="217" y="51" text-anchor="middle" class="badge" fill="#7dd3fc">CLOUD FILESTORE</text>
    <text x="610" y="54" text-anchor="middle" class="title" font-size="19">Regional NFS Volume  —  Kubernetes PVC (<tspan class="mono">ReadWriteMany</tspan>)</text>
    <text x="580" y="82" text-anchor="middle" class="mono" font-size="13.5">/scion-groves/order-service/.scion/worktrees/{lead-mgr, sec-patch, grpc-mig}</text>
    <text x="580" y="102" text-anchor="middle" class="muted" font-size="12">Persists across Pod restarts and GKE Autopilot node scale-downs</text>
  </g>

  <!-- 4 RWX Mount Arrows -->
  <path d="M220 114 L155 174" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <path d="M460 114 L435 174" stroke="#34a853" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <path d="M700 114 L725 174" stroke="#34a853" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <path d="M940 114 L1005 174" stroke="#34a853" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <!-- Pod 0: Runtime Broker Deployment -->
  <g filter="url(#shadow)">
    <rect x="28" y="178" width="254" height="142" rx="12" fill="url(#amberCard)" stroke="#fbbc04" stroke-width="2"/>
    <text x="155" y="208" text-anchor="middle" class="title" font-size="16" fill="#fde047">Runtime Broker Pod</text>
    <text x="155" y="232" text-anchor="middle" class="mono" font-size="12.5">deploy/scion-broker</text>
    <text x="155" y="258" text-anchor="middle" class="sub" font-size="12.5">Provisions Git worktrees</text>
    <text x="155" y="278" text-anchor="middle" class="sub" font-size="12.5">&amp; spawns Agent Pods via</text>
    <text x="155" y="298" text-anchor="middle" class="mono" font-size="12">Kubernetes Pod API</text>
  </g>

  <!-- Pod 1: Manager Pod -->
  <g filter="url(#shadow)">
    <rect x="304" y="178" width="264" height="142" rx="12" fill="url(#blueCard)" stroke="#4285f4" stroke-width="2"/>
    <text x="436" y="208" text-anchor="middle" class="title" font-size="16">pod/agent-lead-mgr</text>
    <text x="436" y="232" text-anchor="middle" class="mono" font-size="13">Harness: antigravity</text>
    <text x="436" y="258" text-anchor="middle" class="sub" font-size="12.5">SubPath Mount:</text>
    <text x="436" y="278" text-anchor="middle" class="mono" font-size="12" fill="#86efac">wt/lead-mgr → /workspace</text>
    <text x="436" y="302" text-anchor="middle" class="muted" font-size="11.5">GKE Autopilot Node A</text>
  </g>

  <!-- Pod 2: Sec-Patch Pod -->
  <g filter="url(#shadow)">
    <rect x="590" y="178" width="264" height="142" rx="12" fill="url(#greenCard)" stroke="#34a853" stroke-width="2"/>
    <text x="722" y="208" text-anchor="middle" class="title" font-size="16">pod/agent-sec-patch</text>
    <text x="722" y="232" text-anchor="middle" class="mono" font-size="13">Harness: antigravity</text>
    <text x="722" y="258" text-anchor="middle" class="sub" font-size="12.5">SubPath Mount:</text>
    <text x="722" y="278" text-anchor="middle" class="mono" font-size="12" fill="#86efac">wt/sec-patch → /workspace</text>
    <text x="722" y="302" text-anchor="middle" class="muted" font-size="11.5">GKE Autopilot Node B</text>
  </g>

  <!-- Pod 3: gRPC-Mig Pod -->
  <g filter="url(#shadow)">
    <rect x="876" y="178" width="256" height="142" rx="12" fill="url(#greenCard)" stroke="#34a853" stroke-width="2"/>
    <text x="1004" y="208" text-anchor="middle" class="title" font-size="16">pod/agent-grpc-mig</text>
    <text x="1004" y="232" text-anchor="middle" class="mono" font-size="13">Harness: gemini-cli</text>
    <text x="1004" y="258" text-anchor="middle" class="sub" font-size="12.5">SubPath Mount:</text>
    <text x="1004" y="278" text-anchor="middle" class="mono" font-size="12" fill="#86efac">wt/grpc-mig → /workspace</text>
    <text x="1004" y="302" text-anchor="middle" class="muted" font-size="11.5">GKE Autopilot Node C</text>
  </g>
</svg>