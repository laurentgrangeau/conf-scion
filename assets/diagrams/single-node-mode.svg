<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4285f4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34a853"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbc04"/>
    </marker>
    <style>
      .title { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
      .sub { font-family: "Inter", system-ui, sans-serif; font-weight: 500; fill: #cbd5e1; }
      .muted { font-family: "Inter", system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
      .mono { font-family: "JetBrains Mono", "Fira Code", monospace; font-weight: 600; fill: #7dd3fc; }
      .badge { font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect x="4" y="4" width="552" height="352" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <!-- Outer VM Boundary -->
  <rect x="24" y="20" width="512" height="320" rx="12" fill="none" stroke="#fbbc04" stroke-width="1.8" stroke-dasharray="6,4"/>
  <rect x="40" y="10" width="240" height="22" rx="6" fill="#090d16" stroke="#fbbc04"/>
  <text x="160" y="25" text-anchor="middle" class="badge" fill="#fde047">SHARED CLOUD VM / HOST</text>

  <!-- Scion Hub + SQLite -->
  <g filter="url(#shadow)">
    <rect x="48" y="46" width="464" height="96" rx="10" fill="url(#cyanCard)" stroke="#38bdf8" stroke-width="2"/>
    <text x="280" y="76" text-anchor="middle" class="title" font-size="17.5">Scion Hub + SSE Web UI</text>
    <text x="280" y="100" text-anchor="middle" class="mono" font-size="13.5">Embedded SQLite DB (WAL Mode)</text>
    <text x="280" y="124" text-anchor="middle" class="muted" font-size="12">Zero external database dependencies • Built-in OAuth</text>
  </g>

  <path d="M280 142 L280 184" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="200" y="152" width="160" height="20" rx="10" fill="#090d16" stroke="#334155"/>
  <text x="280" y="166" text-anchor="middle" class="muted" font-size="11">Co-located Socket</text>

  <!-- Local Docker Runtime Broker -->
  <g filter="url(#shadow)">
    <rect x="48" y="188" width="464" height="132" rx="10" fill="url(#greenCard)" stroke="#34a853" stroke-width="2"/>
    <text x="280" y="216" text-anchor="middle" class="title" font-size="16.5">Co-Located Docker Runtime Broker</text>
    <rect x="68" y="232" width="204" height="70" rx="8" fill="#0f172a" stroke="#4285f4" stroke-width="1.5"/>
    <text x="170" y="260" text-anchor="middle" class="mono" font-size="14">antigravity</text>
    <text x="170" y="284" text-anchor="middle" class="muted" font-size="11.5">Container + Host Worktree</text>

    <rect x="288" y="232" width="204" height="70" rx="8" fill="#0f172a" stroke="#34a853" stroke-width="1.5"/>
    <text x="390" y="260" text-anchor="middle" class="mono" font-size="14" fill="#86efac">gemini-cli</text>
    <text x="390" y="284" text-anchor="middle" class="muted" font-size="11.5">Container + Host Worktree</text>
  </g>
</svg>