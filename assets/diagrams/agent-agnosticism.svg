<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4285f4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34a853"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbc04"/>
    </marker>
    <style>
      .title { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
      .sub { font-family: "Inter", system-ui, sans-serif; font-weight: 500; fill: #cbd5e1; }
      .muted { font-family: "Inter", system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
      .mono { font-family: "JetBrains Mono", "Fira Code", monospace; font-weight: 600; fill: #7dd3fc; }
      .badge { font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect x="4" y="4" width="552" height="352" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <!-- Hub Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="28" width="480" height="106" rx="12" fill="url(#cyanCard)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="82" cy="64" r="18" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M74 64 h16 M82 56 v16 M76 58 l12 12 M88 58 l-12 12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="60" class="title" font-size="18">Scion Control Plane (Hub &amp; Broker)</text>
    <text x="112" y="84" class="sub" font-size="13">Standardized Lifecycle  •  Git Worktrees  •  Credentials  •  Messaging</text>
    <rect x="112" y="96" width="96" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="111" text-anchor="middle" class="mono" font-size="11">scion_harness</text>
    <rect x="218" y="96" width="110" height="22" rx="11" fill="#0f172a" stroke="#34a853" stroke-width="1"/>
    <text x="273" y="111" text-anchor="middle" class="mono" font-size="11" fill="#86efac">OCI Sandbox</text>
    <rect x="338" y="96" width="110" height="22" rx="11" fill="#0f172a" stroke="#fbbc04" stroke-width="1"/>
    <text x="393" y="111" text-anchor="middle" class="mono" font-size="11" fill="#fde047">OTel Telemetry</text>
  </g>

  <!-- Connector Arrows -->
  <path d="M160 134 L160 198" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowCyan)"/>
  <path d="M400 134 L400 198" stroke="#34a853" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowGreen)"/>
  <rect x="105" y="154" width="110" height="22" rx="6" fill="#090d16" stroke="#334155"/>
  <text x="160" y="169" text-anchor="middle" class="muted" font-size="11">provision.py</text>
  <rect x="345" y="154" width="110" height="22" rx="6" fill="#090d16" stroke="#334155"/>
  <text x="400" y="169" text-anchor="middle" class="muted" font-size="11">provision.py</text>

  <!-- Left Pod: antigravity -->
  <g filter="url(#shadow)">
    <rect x="36" y="206" width="232" height="126" rx="12" fill="url(#blueCard)" stroke="#4285f4" stroke-width="2"/>
    <rect x="52" y="220" width="68" height="20" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="86" y="234" text-anchor="middle" class="badge" fill="#93c5fd">GOOGLE</text>
    <text x="152" y="264" text-anchor="middle" class="mono" font-size="18" fill="#ffffff">antigravity</text>
    <text x="152" y="286" text-anchor="middle" class="sub" font-size="12.5">Lead Architect / Security</text>
    <text x="152" y="308" text-anchor="middle" class="muted" font-size="11.5">Container / GKE Pod + tmux</text>
  </g>

  <!-- Right Pod: gemini-cli -->
  <g filter="url(#shadow)">
    <rect x="292" y="206" width="232" height="126" rx="12" fill="url(#greenCard)" stroke="#34a853" stroke-width="2"/>
    <rect x="308" y="220" width="68" height="20" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
    <text x="342" y="234" text-anchor="middle" class="badge" fill="#86efac">GOOGLE</text>
    <text x="408" y="264" text-anchor="middle" class="mono" font-size="18" fill="#ffffff">gemini-cli</text>
    <text x="408" y="286" text-anchor="middle" class="sub" font-size="12.5">High-Speed Worker Fleet</text>
    <text x="408" y="308" text-anchor="middle" class="muted" font-size="11.5">Container / GKE Pod + tmux</text>
  </g>
</svg>