<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 360" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4285f4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34a853"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbc04"/>
    </marker>
    <style>
      .title { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
      .sub { font-family: "Inter", system-ui, sans-serif; font-weight: 500; fill: #cbd5e1; }
      .muted { font-family: "Inter", system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
      .mono { font-family: "JetBrains Mono", "Fira Code", monospace; font-weight: 600; fill: #7dd3fc; }
      .badge { font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect x="4" y="4" width="1152" height="352" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <!-- Left Column Header: Kubernetes -->
  <rect x="36" y="22" width="440" height="44" rx="10" fill="url(#blueCard)" stroke="#4285f4" stroke-width="2"/>
  <text x="256" y="50" text-anchor="middle" class="title" font-size="19" fill="#93c5fd">Kubernetes (Microservice Orchestration)</text>

  <!-- Right Column Header: Scion -->
  <rect x="684" y="22" width="440" height="44" rx="10" fill="url(#greenCard)" stroke="#34a853" stroke-width="2"/>
  <text x="904" y="50" text-anchor="middle" class="title" font-size="19" fill="#86efac">Google Cloud Scion (Agent Fleet Orchestration)</text>

  <!-- Row 1: Control Plane -->
  <g filter="url(#shadow)">
    <rect x="36" y="80" width="440" height="58" rx="10" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="58" y="105" class="title" font-size="15">Control Plane &amp; State Store</text>
    <text x="58" y="126" class="mono" font-size="13">kube-apiserver + etcd</text>

    <path d="M492 109 L668 109" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>
    <rect x="526" y="96" width="108" height="24" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="580" y="112" text-anchor="middle" class="badge" fill="#38bdf8">CONTROL PLANE</text>

    <rect x="684" y="80" width="440" height="58" rx="10" fill="#131c31" stroke="#34a853" stroke-width="1.5"/>
    <text x="706" y="105" class="title" font-size="15">Scion Hub &amp; Database</text>
    <text x="706" y="126" class="mono" font-size="13" fill="#86efac">Scion Hub API/UI + Cloud SQL (PostgreSQL)</text>
  </g>

  <!-- Row 2: Node Daemon -->
  <g filter="url(#shadow)">
    <rect x="36" y="148" width="440" height="58" rx="10" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="58" y="173" class="title" font-size="15">Node Execution Daemon</text>
    <text x="58" y="194" class="mono" font-size="13">kubelet + containerd on Nodes</text>

    <path d="M492 177 L668 177" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>
    <rect x="526" y="164" width="108" height="24" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="580" y="180" text-anchor="middle" class="badge" fill="#38bdf8">EXECUTION</text>

    <rect x="684" y="148" width="440" height="58" rx="10" fill="#131c31" stroke="#34a853" stroke-width="1.5"/>
    <text x="706" y="173" class="title" font-size="15">Scion Runtime Broker</text>
    <text x="706" y="194" class="mono" font-size="13" fill="#86efac">Docker / Podman / Apple VZ / GKE Broker</text>
  </g>

  <!-- Row 3: Workload Unit -->
  <g filter="url(#shadow)">
    <rect x="36" y="216" width="440" height="58" rx="10" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="58" y="241" class="title" font-size="15">Atomic Scheduling Unit</text>
    <text x="58" y="262" class="mono" font-size="13">Pod (Containers + Shared Namespaces)</text>

    <path d="M492 245 L668 245" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>
    <rect x="526" y="232" width="108" height="24" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="580" y="248" text-anchor="middle" class="badge" fill="#38bdf8">SANDBOX UNIT</text>

    <rect x="684" y="216" width="440" height="58" rx="10" fill="#131c31" stroke="#34a853" stroke-width="1.5"/>
    <text x="706" y="241" class="title" font-size="15">Scion Autonomous Agent</text>
    <text x="706" y="262" class="mono" font-size="13" fill="#86efac">OCI Container + Git Worktree + tmux + Harness</text>
  </g>

  <!-- Row 4: Config & Security -->
  <g filter="url(#shadow)">
    <rect x="36" y="284" width="440" height="58" rx="10" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="58" y="309" class="title" font-size="15">Declarative Config &amp; Identity</text>
    <text x="58" y="330" class="mono" font-size="13">ConfigMap, Secret &amp; ServiceAccount</text>

    <path d="M492 313 L668 313" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>
    <rect x="526" y="300" width="108" height="24" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="580" y="316" text-anchor="middle" class="badge" fill="#38bdf8">CONFIGURATION</text>

    <rect x="684" y="284" width="440" height="58" rx="10" fill="#131c31" stroke="#34a853" stroke-width="1.5"/>
    <text x="706" y="309" class="title" font-size="15">Roles, Capabilities &amp; Zero-Trust</text>
    <text x="706" y="330" class="mono" font-size="13" fill="#86efac">Template Roles + Skills + Secret Manager + WI</text>
  </g>
</svg>