<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 350" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4285f4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34a853"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbc04"/>
    </marker>
    <style>
      .title { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
      .sub { font-family: "Inter", system-ui, sans-serif; font-weight: 500; fill: #cbd5e1; }
      .muted { font-family: "Inter", system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
      .mono { font-family: "JetBrains Mono", "Fira Code", monospace; font-weight: 600; fill: #7dd3fc; }
      .badge { font-family: "Inter", system-ui, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect x="4" y="4" width="1152" height="342" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Box: Shared Git Object Store -->
  <g filter="url(#shadow)">
    <rect x="28" y="88" width="260" height="174" rx="12" fill="url(#amberCard)" stroke="#fbbc04" stroke-width="2"/>
    <text x="158" y="126" text-anchor="middle" class="title" font-size="18" fill="#fde047">Shared Git Object Store</text>
    <text x="158" y="152" text-anchor="middle" class="mono" font-size="14">repo.git/ (.scion/)</text>
    <text x="158" y="182" text-anchor="middle" class="sub" font-size="13">Zero-Copy Git Objects</text>
    <text x="158" y="204" text-anchor="middle" class="sub" font-size="13">Instant Branch Creation</text>
    <text x="158" y="232" text-anchor="middle" class="muted" font-size="12">Local Disk or Cloud Filestore</text>
  </g>

  <!-- Arrows from Git Store to Worktrees -->
  <path d="M288 130 L380 72" stroke="#fbbc04" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
  <path d="M288 175 L380 175" stroke="#fbbc04" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
  <path d="M288 220 L380 278" stroke="#fbbc04" stroke-width="2.2" marker-end="url(#arrowAmber)"/>

  <!-- Middle Column: 3 Dedicated Worktrees -->
  <g filter="url(#shadow)">
    <rect x="386" y="28" width="270" height="86" rx="10" fill="url(#cyanCard)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="521" y="56" text-anchor="middle" class="mono" font-size="14">.scion/worktrees/lead-mgr/</text>
    <text x="521" y="80" text-anchor="middle" class="sub" font-size="13">Branch: <tspan class="mono" fill="#86efac">scion/lead-mgr</tspan></text>
    <text x="521" y="100" text-anchor="middle" class="muted" font-size="11.5">Dedicated index.lock &amp; working tree</text>

    <rect x="386" y="132" width="270" height="86" rx="10" fill="url(#cyanCard)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="521" y="160" text-anchor="middle" class="mono" font-size="14">.scion/worktrees/sec-patch/</text>
    <text x="521" y="184" text-anchor="middle" class="sub" font-size="13">Branch: <tspan class="mono" fill="#86efac">scion/sec-patch</tspan></text>
    <text x="521" y="204" text-anchor="middle" class="muted" font-size="11.5">Dedicated index.lock &amp; working tree</text>

    <rect x="386" y="236" width="270" height="86" rx="10" fill="url(#cyanCard)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="521" y="264" text-anchor="middle" class="mono" font-size="14">.scion/worktrees/grpc-mig/</text>
    <text x="521" y="288" text-anchor="middle" class="sub" font-size="13">Branch: <tspan class="mono" fill="#86efac">scion/grpc-mig</tspan></text>
    <text x="521" y="308" text-anchor="middle" class="muted" font-size="11.5">Dedicated index.lock &amp; working tree</text>
  </g>

  <!-- Bind-mount arrows -->
  <path d="M656 71 L758 71" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <path d="M656 175 L758 175" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <path d="M656 279 L758 279" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrowCyan)"/>
  <text x="707" y="62" text-anchor="middle" class="mono" font-size="11">/workspace</text>
  <text x="707" y="166" text-anchor="middle" class="mono" font-size="11">/workspace</text>
  <text x="707" y="270" text-anchor="middle" class="mono" font-size="11">/workspace</text>

  <!-- Right Column: 3 Isolated Containers -->
  <g filter="url(#shadow)">
    <rect x="764" y="28" width="366" height="86" rx="10" fill="url(#blueCard)" stroke="#4285f4" stroke-width="2"/>
    <text x="947" y="56" text-anchor="middle" class="title" font-size="15.5">OCI Sandbox #1 (Manager Pod)</text>
    <text x="947" y="80" text-anchor="middle" class="mono" font-size="13.5">tmux + antigravity --yolo</text>
    <text x="947" y="100" text-anchor="middle" class="muted" font-size="11.5">Isolated PID / Net / Ephemeral /tmp</text>

    <rect x="764" y="132" width="366" height="86" rx="10" fill="url(#greenCard)" stroke="#34a853" stroke-width="2"/>
    <text x="947" y="160" text-anchor="middle" class="title" font-size="15.5">OCI Sandbox #2 (Worker Pod)</text>
    <text x="947" y="184" text-anchor="middle" class="mono" font-size="13.5" fill="#86efac">tmux + antigravity --yolo</text>
    <text x="947" y="204" text-anchor="middle" class="muted" font-size="11.5">Isolated PID / Net / Ephemeral /tmp</text>

    <rect x="764" y="236" width="366" height="86" rx="10" fill="url(#greenCard)" stroke="#34a853" stroke-width="2"/>
    <text x="947" y="264" text-anchor="middle" class="title" font-size="15.5">OCI Sandbox #3 (Worker Pod)</text>
    <text x="947" y="288" text-anchor="middle" class="mono" font-size="13.5" fill="#86efac">tmux + gemini-cli --yolo</text>
    <text x="947" y="308" text-anchor="middle" class="muted" font-size="11.5">Isolated PID / Net / Ephemeral /tmp</text>
  </g>
</svg>